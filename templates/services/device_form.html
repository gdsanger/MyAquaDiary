{% extends "base.html" %}

{% block title %}{{ device.name }} bearbeiten – MyAquaDiary{% endblock %}

{% block content %}
<nav aria-label="Brotkrumen" class="mb-2">
  <a href="{% url 'services:device_detail' device.pk %}" class="small">← {{ device.name }}</a>
</nav>
<h1 class="h3 mb-3">Gerät bearbeiten</h1>

<div class="row">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card">
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {% include "services/_form_fields.html" %}
          <button type="submit" class="btn btn-primary">Speichern</button>
          <a class="btn btn-outline-secondary" href="{% url 'services:device_detail' device.pk %}">Abbrechen</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
