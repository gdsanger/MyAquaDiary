{% extends "base.html" %}

{% block title %}Bepflanzung löschen – {{ tank.name }} – MyAquaDiary{% endblock %}

{% block content %}
<h1 class="h3 mb-3">„{{ tank_plant.plant }}“ aus {{ tank.name }} löschen?</h1>
<p class="text-body-secondary">Diese Aktion kann nicht rückgängig gemacht werden.</p>

<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Endgültig löschen</button>
  <a href="{% url 'tanks:plant-list' tank.slug %}" class="btn btn-outline-secondary">Abbrechen</a>
</form>
{% endblock %}
