{% extends "base.html" %}

{% block title %}Anmelden – MyAquaDiary{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-5 col-lg-4">
    <div class="mad-card">
      <div class="mad-card__header">
        <h1 class="mad-card__title">Anmelden</h1>
      </div>
      <div class="mad-card__body">
        <form method="post">
          {% csrf_token %}
          {% if form.errors %}
            <div class="mad-alert mad-alert--critical mb-3" role="alert">
              <p class="mad-alert__title mb-0">Benutzername und Passwort stimmen nicht überein.</p>
            </div>
          {% endif %}
          <div class="mb-3">
            <label for="id_username" class="form-label">Benutzername</label>
            <input type="text" name="username" class="form-control" id="id_username" autofocus required>
          </div>
          <div class="mb-3">
            <label for="id_password" class="form-label">Passwort</label>
            <input type="password" name="password" class="form-control" id="id_password" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-primary w-100">Anmelden</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
