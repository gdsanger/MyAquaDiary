services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: requirements/development.txt
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - .:/app
      - media_data:/app/mediafiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # MCP-Endpunkt für externe KI-Clients — eigener Dienst, gleiches Abbild und
  # dieselbe Datenbank. Die Migrationen laufen im Web-Dienst, hier nicht.
  mcp:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: requirements/development.txt
    command: python manage.py run_mcp_server 0.0.0.0:8001
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - .:/app
      - media_data:/app/mediafiles
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
