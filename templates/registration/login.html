{% extends "base.html" %}

{% block title %}Login – MyAquaDiary{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-5 col-lg-4">
    <div class="card">
      <div class="card-body">
        <h1 class="h4 card-title mb-3">Login</h1>
        <form method="post">
          {% csrf_token %}
          {% if form.errors %}
            <div class="alert alert-danger" role="alert">
              Benutzername und Passwort stimmen nicht überein.
            </div>
          {% endif %}
          <div class="mb-3">
            <label for="id_username" class="form-label">Benutzername</label>
            <input type="text" name="username" class="form-control" id="id_username" autofocus required>
          </div>
          <div class="mb-3">
            <label for="id_password" class="form-label">Passwort</label>
            <input type="password" name="password" class="form-control" id="id_password" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-primary w-100">Anmelden</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
