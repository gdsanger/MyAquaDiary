{% comment %}Table-basierter Button (Outlook rendert kein padding auf <a>). Kontext: url, label{% endcomment %}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:20px 0;">
  <tr>
    <td align="center" bgcolor="#0f7a8c" style="border-radius:4px;">
      <a href="{{ url }}" style="display:inline-block; padding:12px 26px; font-family:Helvetica,Arial,sans-serif; font-size:15px; font-weight:bold; color:#ffffff; text-decoration:none;">{{ label }}</a>
    </td>
  </tr>
</table>
